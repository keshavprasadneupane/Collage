<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ASP.NET Core Session Management</title>
	<style>
		body {
			font-family: system-ui, -apple-system, sans-serif;
			max-width: 500px;
			margin: 2rem auto;
			padding: 0 1rem;
		}

		.card {
			background: #f9f9f9;
			padding: 1.2rem;
			border-radius: 6px;
			border: 1px solid #ddd;
			margin-bottom: 1.5rem;
		}

		form {
			display: grid;
			gap: 0.6rem;
		}

		input,
		select,
		button {
			padding: 0.6rem;
			font-size: 1rem;
		}

		button {
			background-color: #0066cc;
			color: white;
			border: none;
			cursor: pointer;
			border-radius: 4px;
		}

		button:hover {
			background-color: #004999;
		}

		.btn-logout {
			background-color: #d9534f;
			margin-top: 1rem;
		}

		.btn-logout:hover {
			background-color: #c9302c;
		}

		.status-box {
			background: #e8f5e9;
			padding: 1rem;
			border-radius: 4px;
			border: 1px solid #c8e6c9;
		}

		.unauth-box {
			background: #ffebee;
			padding: 1rem;
			border-radius: 4px;
			border: 1px solid #ffcdd2;
			color: #c62828;
		}
	</style>
</head>

<body>

	<h2>Session Management Demo</h2>

	<!-- Login Form -->
	<div class="card" id="loginCard">
		<h3>Start Session (Login)</h3>
		<form id="loginForm">
			<input id="username" placeholder="Username" required />
			<select id="role">
				<option value="Admin">Admin</option>
				<option value="Developer">Developer</option>
				<option value="Guest">Guest</option>
			</select>
			<button type="submit">Set Session Data</button>
		</form>
	</div>

	<!-- Session Display -->
	<div class="card">
		<h3>Active Session Status</h3>
		<div id="sessionDisplay">Loading...</div>
	</div>

	<script>
		async function checkSession() {
			const display = document.getElementById('sessionDisplay');
			const res = await fetch('/api/session/user');

			if (res.ok) {
				const data = await res.json();
				display.innerHTML = `
          <div class="status-box">
            <strong>Active User:</strong> ${data.username}<br>
            <strong>Role:</strong> ${data.role}<br>
            <strong>Login Time:</strong> ${data.loginTime}<br>
            <small><strong>Session ID:</strong> ${data.sessionId}</small>
          </div>
          <button class="btn-logout" onclick="logout()">Destroy Session (Logout)</button>
        `;
			} else {
				display.innerHTML = `<div class="unauth-box">No active session found.</div>`;
			}
		}

		document.getElementById('loginForm').onsubmit = async (e) => {
			e.preventDefault();
			const payload = {
				username: document.getElementById('username').value,
				role: document.getElementById('role').value
			};

			await fetch('/api/session/login', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(payload)
			});

			document.getElementById('username').value = '';
			checkSession();
		};

		async function logout() {
			await fetch('/api/session/logout', { method: 'POST' });
			checkSession();
		}

		checkSession();
	</script>
</body>

</html>
