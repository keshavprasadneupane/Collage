<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Employee Registry</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			max-width: 650px;
			margin: 2rem auto;
			padding: 0 1rem;
		}

		form {
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem;
			margin-bottom: 1.5rem;
		}

		input {
			flex: 1 1 40%;
			padding: 0.5rem;
		}

		button {
			padding: 0.5rem 1rem;
			cursor: pointer;
		}

		ul {
			list-style: none;
			padding: 0;
		}

		li {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 0.75rem;
			border-bottom: 1px solid #ccc;
		}
	</style>
</head>

<body>

	<h2>Employee Registry</h2>

	<form id="empForm">
		<input name="firstName" placeholder="First Name" required />
		<input name="lastName" placeholder="Last Name" required />
		<input name="email" type="email" placeholder="Email" required />
		<input name="department" placeholder="Department" required />
		<button type="submit">Add Employee</button>
	</form>

	<ul id="empList"></ul>

	<script>
		const API = '/api/employees';

		// Helper wrapper for API requests
		const apiReq = (url, method = 'GET', body) =>
			fetch(url, {
				method,
				headers: body ? { 'Content-Type': 'application/json' } : {},
				body: body ? JSON.stringify(body) : null
			});

		async function loadEmployees() {
			const res = await apiReq(API);
			const employees = await res.json();

			document.getElementById('empList').innerHTML = employees.map(e => `
        <li id="emp-${e.id}">
          <div>
            <strong>${e.firstName} ${e.lastName}</strong><br>
            <small>${e.department} — ${e.email}</small>
          </div>
          <div>
            <button onclick="renderEditMode(${e.id}, '${e.firstName}', '${e.lastName}', '${e.email}', '${e.department}')">Edit</button>
            <button onclick="deleteEmp(${e.id})">Delete</button>
          </div>
        </li>
      `).join('');
		}

		// Add employee using FormData
		document.getElementById('empForm').onsubmit = async (e) => {
			e.preventDefault();
			const data = Object.fromEntries(new FormData(e.target));
			await apiReq(API, 'POST', data);
			e.target.reset();
			loadEmployees();
		};

		// Render edit inputs inside a form
		function renderEditMode(id, fn, ln, em, dp) {
			const li = document.getElementById(`emp-${id}`);
			li.innerHTML = `
        <form onsubmit="saveEdit(event, ${id})" style="width: 100%; margin: 0;">
          <input name="firstName" value="${fn}" required />
          <input name="lastName" value="${ln}" required />
          <input name="email" value="${em}" type="email" required />
          <input name="department" value="${dp}" required />
          <button type="submit">Save</button>
          <button type="button" onclick="loadEmployees()">Cancel</button>
        </form>
      `;
		}

		// Save edited employee
		async function saveEdit(e, id) {
			e.preventDefault();
			const data = Object.fromEntries(new FormData(e.target));
			await apiReq(`${API}/${id}`, 'PUT', data);
			loadEmployees();
		}

		// Delete employee
		async function deleteEmp(id) {
			if (confirm('Delete employee?')) {
				await apiReq(`${API}/${id}`, 'DELETE');
				loadEmployees();
			}
		}

		loadEmployees();
	</script>
</body>

</html>
