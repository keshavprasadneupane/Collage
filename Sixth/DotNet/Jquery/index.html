<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>jQuery Form Validation</title>
	<style>
		body {
			font-family: system-ui, -apple-system, sans-serif;
			max-width: 400px;
			margin: 2rem auto;
			padding: 0 1rem;
		}

		.form-group {
			margin-bottom: 1rem;
		}

		label {
			display: block;
			margin-bottom: 0.25rem;
			font-weight: 600;
		}

		input {
			width: 100%;
			padding: 0.5rem;
			box-sizing: border-box;
			font-size: 1rem;
		}

		button {
			width: 100%;
			padding: 0.6rem;
			background-color: #0066cc;
			color: white;
			border: none;
			font-size: 1rem;
			border-radius: 4px;
			cursor: pointer;
		}

		button:hover {
			background-color: #004999;
		}

		.error {
			color: #d9534f;
			font-size: 0.85rem;
			margin-top: 0.25rem;
			display: block;
		}

		.success {
			color: #28a745;
			font-weight: bold;
			margin-top: 1rem;
			text-align: center;
		}
	</style>
	<!-- jQuery CDN -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

	<h2>User Registration</h2>

	<form id="userForm">
		<div class="form-group">
			<label for="username">User Name</label>
			<input type="text" id="username" placeholder="Enter username">
			<span class="error" id="usernameError"></span>
		</div>

		<div class="form-group">
			<label for="password">Password</label>
			<input type="password" id="password" placeholder="Enter password">
			<span class="error" id="passwordError"></span>
		</div>

		<div class="form-group">
			<label for="phone">Phone Number</label>
			<input type="text" id="phone" placeholder="Enter 10-digit phone number">
			<span class="error" id="phoneError"></span>
		</div>

		<button type="submit">Submit</button>
	</form>

	<div id="formSuccess" class="success"></div>

	<script>
		$(document).ready(function () {
			$('#userForm').on('submit', function (e) {
				e.preventDefault(); // Prevent form submission

				// Clear previous messages
				$('.error').text('');
				$('#formSuccess').text('');

				// Fetch trimmed input values
				let username = $('#username').val().trim();
				let password = $('#password').val().trim();
				let phone = $('#phone').val().trim();

				let isValid = true;

				// 1. Username non-empty check
				if (username === '') {
					$('#usernameError').text('User name is required.');
					isValid = false;
				}

				// 2. Password non-empty check
				if (password === '') {
					$('#passwordError').text('Password is required.');
					isValid = false;
				}

				// 3. Phone non-empty and 10-digit numeric check
				let phoneRegex = /^\d{10}$/;
				if (phone === '') {
					$('#phoneError').text('Phone number is required.');
					isValid = false;
				} else if (!phoneRegex.test(phone)) {
					$('#phoneError').text('Phone number must contain exactly 10 digits.');
					isValid = false;
				}

				// If all checks pass
				if (isValid) {
					$('#formSuccess').text('Form submitted successfully!');
					$('#userForm')[0].reset(); // Clear form fields
				}
			});
		});
	</script>

</body>

</html>
