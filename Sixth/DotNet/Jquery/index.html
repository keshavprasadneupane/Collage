<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>User Registration</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			max-width: 360px;
			margin: 2rem auto;
			padding: 0 1rem;
		}

		.group {
			margin-bottom: 0.8rem;
		}

		label {
			display: block;
			font-weight: 600;
			margin-bottom: 0.2rem;
		}

		input,
		button {
			width: 100%;
			padding: 0.5rem;
			font-size: 1rem;
			box-sizing: border-box;
		}

		button {
			background: #0066cc;
			color: white;
			border: none;
			border-radius: 4px;
			cursor: pointer;
		}

		button:hover {
			background: #004999;
		}

		.error {
			color: #d9534f;
			font-size: 0.85rem;
			margin-top: 0.2rem;
			display: block;
		}

		.success {
			color: #28a745;
			font-weight: bold;
			margin-top: 1rem;
			text-align: center;
		}
	</style>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

	<h2>User Registration</h2>

	<form id="userForm">
		<div class="group">
			<label for="username">User Name</label>
			<input type="text" id="username" placeholder="Enter username">
			<span class="error" id="usernameError"></span>
		</div>

		<div class="group">
			<label for="password">Password</label>
			<input type="password" id="password" placeholder="Enter password">
			<span class="error" id="passwordError"></span>
		</div>

		<div class="group">
			<label for="phone">Phone Number</label>
			<input type="text" id="phone" placeholder="10-digit number">
			<span class="error" id="phoneError"></span>
		</div>

		<button type="submit">Submit</button>
	</form>

	<div id="formSuccess" class="success"></div>

	<script>
		$('#userForm').on('submit', function (e) {
			e.preventDefault();
			$('.error, #formSuccess').text('');

			const user = $('#username').val().trim();
			const pass = $('#password').val().trim();
			const phone = $('#phone').val().trim();
			let valid = true;

			if (!user) { $('#usernameError').text('User name is required.'); valid = false; }
			if (!pass) { $('#passwordError').text('Password is required.'); valid = false; }

			if (!phone) {
				$('#phoneError').text('Phone number is required.');
				valid = false;
			} else if (!/^\d{10}$/.test(phone)) {
				$('#phoneError').text('Must be exactly 10 digits.');
				valid = false;
			}

			if (valid) {
				$('#formSuccess').text('Form submitted successfully!');
				this.reset();
			}
		});
	</script>

</body>

</html>
