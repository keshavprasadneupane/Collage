<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>IOST Faculty Registry</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			max-width: 650px;
			margin: 2rem auto;
			padding: 0 1rem;
		}

		.card {
			background: #f9f9f9;
			padding: 1rem;
			border: 1px solid #ddd;
			border-radius: 6px;
			margin-bottom: 1rem;
		}

		form {
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem;
		}

		input {
			flex: 1 1 40%;
			padding: 0.5rem;
		}

		button {
			padding: 0.5rem 1rem;
			cursor: pointer;
		}

		ul {
			list-style: none;
			padding: 0;
		}

		li {
			padding: 0.75rem;
			border-bottom: 1px solid #ccc;
		}

		.fee-result {
			background: #e8f5e9;
			padding: 0.5rem;
			border-radius: 4px;
			margin-top: 0.5rem;
		}

		.fee-error {
			background: #ffebee;
			color: #c62828;
			padding: 0.5rem;
			border-radius: 4px;
			margin-top: 0.5rem;
		}
	</style>
</head>

<body>

	<h2>IOST Faculty Registry</h2>

	<div class="card">
		<h3>Add New Course Record</h3>
		<form id="facultyForm">
			<input name="courseID" placeholder="Course ID (e.g. CS101)" required />
			<input name="course_Name" placeholder="Course Name (e.g. CSIT)" required />
			<input name="no_of_Semester" type="number" placeholder="No. of Semesters" required />
			<input name="fee" type="number" step="0.01" placeholder="Fee Amount" required />
			<button type="submit">Insert Record</button>
		</form>
	</div>

	<div class="card">
		<h3>Lookup Fee by Course ID</h3>
		<form onsubmit="getFeeByCourseId(event)">
			<input id="searchCourseId" placeholder="Enter Course ID" required />
			<button type="submit">Query Fee</button>
		</form>
		<div id="feeDisplay"></div>
	</div>

	<h3>All Faculty Records</h3>
	<ul id="facultyList"></ul>

	<script>
		const API = '/api/faculty';

		const apiReq = (url, method = 'GET', body) =>
			fetch(url, {
				method,
				headers: body ? { 'Content-Type': 'application/json' } : {},
				body: body ? JSON.stringify(body) : null
			});

		async function loadRecords() {
			const res = await apiReq(API);
			const records = await res.json();
			document.getElementById('facultyList').innerHTML = records.map(f => `
        <li>
          <strong>${f.course_Name}</strong> (${f.courseID})<br>
          <small>Semesters: ${f.no_of_Semester} | Fee: $${f.fee}</small>
        </li>
      `).join('');
		}

		document.getElementById('facultyForm').onsubmit = async (e) => {
			e.preventDefault();
			const data = Object.fromEntries(new FormData(e.target));
			data.no_of_Semester = parseInt(data.no_of_Semester);
			data.fee = parseFloat(data.fee);

			const res = await apiReq(API, 'POST', data);
			if (res.ok) {
				e.target.reset();
				loadRecords();
			} else {
				alert('Failed to insert record.');
			}
		};

		async function getFeeByCourseId(e) {
			e.preventDefault();
			const queryId = document.getElementById('searchCourseId').value.trim();
			const display = document.getElementById('feeDisplay');
			const res = await apiReq(`${API}/fee/${encodeURIComponent(queryId)}`);

			if (res.ok) {
				const data = await res.json();
				display.innerHTML = `<div class="fee-result"><strong>Course:</strong> ${data.course_Name} (${data.courseID})<br><strong>Fee:</strong> $${data.fee}</div>`;
			} else {
				const error = await res.json().catch(() => ({ message: 'Not found' }));
				display.innerHTML = `<div class="fee-error">${error.message || 'Error fetching fee.'}</div>`;
			}
		}

		loadRecords();
	</script>
</body>

</html>
