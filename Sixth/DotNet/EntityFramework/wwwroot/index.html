<!DOCTYPE html>
<html>

<head>
	<title>BAG Registry</title>
	<style>
		body {
			font-family: sans-serif;
			max-width: 600px;
			margin: 2rem auto;
			padding: 0 1rem;
		}

		.card {
			background: #f9f9f9;
			padding: 1rem;
			border: 1px solid #ddd;
			margin-bottom: 1rem;
			border-radius: 4px;
		}

		form {
			display: flex;
			gap: 0.5rem;
			flex-wrap: wrap;
			margin-bottom: 0.5rem;
		}

		input,
		button {
			padding: 0.5rem;
		}

		li {
			list-style: none;
			padding: 0.5rem;
			border: 1px solid #ddd;
			margin-bottom: 0.25rem;
		}

		.res {
			background: #e8f5e9;
			padding: 0.5rem;
			margin-top: 0.5rem;
		}
	</style>
</head>

<body>

	<h2>BAG Registry Management</h2>

	<!-- Add Bag -->
	<div class="card">
		<h3>Add Bag</h3>
		<form id="addForm">
			<input id="brand" placeholder="Brand" required />
			<input id="price" type="number" step="0.01" placeholder="Price" required />
			<input id="date" type="date" required />
			<button>Add</button>
		</form>
	</div>

	<!-- Operations -->
	<div class="card">
		<h3>1. Update Price by Year</h3>
		<form onsubmit="updatePrice(event)">
			<input id="updYear" type="number" placeholder="Year" required />
			<input id="newPrice" type="number" step="0.01" placeholder="New Price" required />
			<button>Update</button>
		</form>
		<div id="updRes"></div>

		<h3>2. Delete by Year</h3>
		<form onsubmit="deleteYear(event)">
			<input id="delYear" type="number" placeholder="Year" required />
			<button>Delete</button>
		</form>
		<div id="delRes"></div>

		<h3>3. Search Brands Above Price</h3>
		<form onsubmit="queryBrands(event)">
			<input id="minPrice" type="number" step="0.01" placeholder="Min Price" required />
			<button>Search</button>
		</form>
		<div id="brandRes"></div>
	</div>

	<!-- Bag List -->
	<h3>Bag Records</h3>
	<ul id="bagList" style="padding:0"></ul>

	<script>
		const API = '/api/bags';

		async function loadBags() {
			const res = await fetch(API);
			const data = await res.json();
			document.getElementById('bagList').innerHTML = data.map(b =>
				`<li><strong>#${b.id}</strong> ${b.brand} - NRS. ${b.price} (${b.date.split('T')[0]})</li>`
			).join('');
		}
		document.getElementById('addForm').onsubmit = async (e) => {
			e.preventDefault();
			await fetch(API, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					brand: document.getElementById('brand').value,
					price: parseFloat(document.getElementById('price').value),
					date: document.getElementById('date').value
				})
			});
			e.target.reset();
			loadBags();
		};

		async function updatePrice(e) {
			e.preventDefault();
			const y = document.getElementById('updYear').value;
			const p = document.getElementById('newPrice').value;
			const res = await fetch(`${API}/update-price?year=${y}&newPrice=${p}`, { method: 'PUT' });
			const data = await res.json();
			document.getElementById('updRes').innerHTML = `<div class="res">${data.message}</div>`;
			loadBags();
		}

		async function deleteYear(e) {
			e.preventDefault();
			const y = document.getElementById('delYear').value;
			const res = await fetch(`${API}/delete-by-year?year=${y}`, { method: 'DELETE' });
			const data = await res.json();
			document.getElementById('delRes').innerHTML = `<div class="res">${data.message}</div>`;
			loadBags();
		}

		async function queryBrands(e) {
			e.preventDefault();
			const p = document.getElementById('minPrice').value;
			const res = await fetch(`${API}/brands-above-price?minPrice=${p}`);
			const data = await res.json();
			document.getElementById('brandRes').innerHTML = `<div class="res">${data.length ? data.map(b => `${b.brand} ($${b.price})`).join(', ') : 'No records found'
				}</div>`;
		}

		loadBags();
	</script>
</body>

</html>
