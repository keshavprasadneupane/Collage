<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BAG Registry Management (EF Core)</title>
	<style>
		body {
			font-family: system-ui, -apple-system, sans-serif;
			max-width: 800px;
			margin: 2rem auto;
			padding: 0 1rem;
		}

		.card {
			background: #f9f9f9;
			padding: 1rem;
			border-radius: 6px;
			border: 1px solid #ddd;
			margin-bottom: 1.5rem;
		}

		form {
			display: grid;
			gap: 0.5rem;
		}

		.inline-form {
			display: flex;
			gap: 0.5rem;
		}

		.inline-form input {
			flex: 1;
		}

		input,
		button {
			padding: 0.6rem;
			font-size: 1rem;
		}

		button {
			background-color: #0066cc;
			color: white;
			border: none;
			cursor: pointer;
			border-radius: 4px;
		}

		button:hover {
			background-color: #004999;
		}

		.btn-update {
			background-color: #f0ad4e;
		}

		.btn-update:hover {
			background-color: #ec971f;
		}

		.btn-delete {
			background-color: #d9534f;
		}

		.btn-delete:hover {
			background-color: #c9302c;
		}

		.btn-search {
			background-color: #28a745;
		}

		.btn-search:hover {
			background-color: #218838;
		}

		ul {
			list-style: none;
			padding: 0;
		}

		li {
			padding: 0.75rem;
			border: 1px solid #ddd;
			margin-bottom: 0.5rem;
			border-radius: 4px;
			background: #fff;
		}

		.res-box {
			background: #e8f5e9;
			padding: 0.75rem;
			border-radius: 4px;
			border: 1px solid #c8e6c9;
			margin-top: 0.5rem;
		}
	</style>
</head>

<body>

	<h2>BAG Registry (EF Core Operations)</h2>

	<!-- Insert Form -->
	<div class="card">
		<h3>Add New Bag Record</h3>
		<form id="addForm">
			<input id="brand" placeholder="Brand Name" required />
			<input id="price" type="number" step="0.01" placeholder="Price" required />
			<input id="date" type="date" required />
			<button type="submit">Insert Record</button>
		</form>
	</div>

	<!-- Operation 1: Update Price by Year -->
	<div class="card">
		<h3>1. Update Price by Target Year</h3>
		<form onsubmit="updatePriceByYear(event)" class="inline-form">
			<input id="updYear" type="number" placeholder="Year (e.g. 2022)" required />
			<input id="newPrice" type="number" step="0.01" placeholder="New Price (e.g. 2000)" required />
			<button type="submit" class="btn-update">Update Price</button>
		</form>
		<div id="updRes"></div>
	</div>

	<!-- Operation 2: Delete by Year -->
	<div class="card">
		<h3>2. Delete Bags by Target Year</h3>
		<form onsubmit="deleteByYear(event)" class="inline-form">
			<input id="delYear" type="number" placeholder="Year (e.g. 1981)" required />
			<button type="submit" class="btn-delete">Delete Records</button>
		</form>
		<div id="delRes"></div>
	</div>

	<!-- Operation 3: Retrieve Brands above Price Threshold -->
	<div class="card">
		<h3>3. Retrieve Brands Above Price Threshold</h3>
		<form onsubmit="queryBrands(event)" class="inline-form">
			<input id="minPrice" type="number" step="0.01" placeholder="Min Price (e.g. 500)" required />
			<button type="submit" class="btn-search">Search Brands</button>
		</form>
		<div id="brandRes"></div>
	</div>

	<!-- Full List -->
	<h3>Current BAG Database Records</h3>
	<ul id="bagList"></ul>

	<script>
		const API = '/api/bags';

		async function loadBags() {
			const res = await fetch(API);
			const data = await res.json();
			const list = document.getElementById('bagList');

			list.innerHTML = data.map(b => `
        <li>
          <strong>ID: ${b.id}</strong> — <strong>Brand:</strong> ${b.brand} | 
          <strong>Price:</strong> $${b.price} | 
          <strong>Date:</strong> ${b.date.split('T')[0]}
        </li>
      `).join('');
		}

		document.getElementById('addForm').onsubmit = async (e) => {
			e.preventDefault();
			const bag = {
				brand: document.getElementById('brand').value,
				price: parseFloat(document.getElementById('price').value),
				date: document.getElementById('date').value
			};

			await fetch(API, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(bag)
			});

			e.target.reset();
			loadBags();
		};

		async function updatePriceByYear(e) {
			e.preventDefault();
			const year = document.getElementById('updYear').value;
			const newPrice = document.getElementById('newPrice').value;

			const res = await fetch(`${API}/update-price?year=${year}&newPrice=${newPrice}`, { method: 'PUT' });
			const data = await res.json();
			document.getElementById('updRes').innerHTML = `<div class="res-box">${data.message}</div>`;
			loadBags();
		}

		async function deleteByYear(e) {
			e.preventDefault();
			const year = document.getElementById('delYear').value;

			const res = await fetch(`${API}/delete-by-year?year=${year}`, { method: 'DELETE' });
			const data = await res.json();
			document.getElementById('delRes').innerHTML = `<div class="res-box">${data.message}</div>`;
			loadBags();
		}

		async function queryBrands(e) {
			e.preventDefault();
			const minPrice = document.getElementById('minPrice').value;

			const res = await fetch(`${API}/brands-above-price?minPrice=${minPrice}`);
			const data = await res.json();

			const display = document.getElementById('brandRes');
			if (data.length === 0) {
				display.innerHTML = `<div class="res-box">No brands found with price > $${minPrice}</div>`;
				return;
			}

			display.innerHTML = `<div class="res-box"><strong>Matching Brands:</strong><br>` +
				data.map(item => `- ${item.brand} ($${item.price})`).join('<br>') + `</div>`;
		}

		loadBags();
	</script>
</body>

</html>
